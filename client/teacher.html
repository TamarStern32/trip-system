    <div class="teacher-page">

        <div class=" teacher-card teacher-details-card">

            <h2>View Teacher</h2>

            <div id="teacherDetails" class="teacher-details">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>First name</th>
                            <th>Last name</th>
                            <th>Class</th>
                        </tr>
                    </thead>

                    <tbody id="teacherStudentsTableBody">
                    </tbody>

                </table>

            </div>

        </div>
